name: Tradeway
description: >-
  Tradeway is an AI-powered field assistant for residential trade contractors
  working in electrical, plumbing, and HVAC. Technicians use it to plan jobs
  step by step with the right materials and code requirements, to identify parts
  from a photo with nearby supplier pricing and sourcing, and to get hands-free
  answers to technical questions on the job site. For business owners it
  centralizes crew history and field activity into a single view, reducing
  callbacks and rework through built-in code checks and standardized, repeatable
  processes so new hires can bill like veterans. Tradeway is backed by Bloomberg
  Beta. As of this enrichment pass the company publishes no public API,
  developer portal, SDKs, or API documentation; this profile captures its
  identity and domain-security posture.
